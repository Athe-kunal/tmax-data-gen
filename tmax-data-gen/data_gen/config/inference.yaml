# Non-secret defaults for W&B Weave Inference (https://docs.wandb.ai/weave/guides/integrations/inference).
# Secrets (WANDB_API_KEY, WANDB_PROJECT) live in .env, not here - see .env.example.
weave_inference:
  base_url: https://api.inference.wandb.ai/v1
  default_model: deepseek-ai/DeepSeek-V4-Flash-0731
  available_models:
    - meta-llama/Llama-3.1-8B-Instruct
    - meta-llama/Llama-3.3-70B-Instruct
    - deepseek-ai/DeepSeek-V4-Flash-0731
    - zai-org/GLM-5.2
    - zai-org/GLM-5.3-Flash
